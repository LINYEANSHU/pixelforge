<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 单文件离线版：双击即用；导出在主线程分片执行 -->
<title>PixelForge 特效工厂</title>
<style>
/* PixelForge 特效工厂 —— 界面样式（系统字体，无外部资源） */
:root {
  --bg0: #101318; --bg1: #171b22; --bg2: #1e242e; --bg3: #262d3a;
  --fg: #d6dde8; --dim: #7d8798; --acc: #5c8dff; --acc2: #8b5cf6;
  --ok: #3ecf8e; --warn: #ffb020; --danger: #ff5a6a;
  --line: #2a3240;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg0); color: var(--fg);
  display: flex; flex-direction: column; overflow: hidden;
  font-size: 13px;
}
.mono { font-family: Consolas, "Courier New", monospace; }
.dim { color: var(--dim); }
.small { font-size: 11px; }
.hidden { display: none !important; }

/* ---------- 顶栏 ---------- */
#topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 8px 14px; background: var(--bg1); border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}
.logo { font-size: 16px; font-weight: 700; color: var(--acc); letter-spacing: .5px; }
.logo .sub { color: var(--fg); font-weight: 500; font-size: 13px; margin-left: 4px; }
.badges { display: flex; gap: 6px; flex: 1 1 auto; }
.badge {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: var(--bg3); color: var(--dim); border: 1px solid var(--line);
}
.badge.ok { color: var(--ok); border-color: #2a5a44; }
.topbtns { display: flex; gap: 10px; align-items: center; }
.tgl { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); cursor: pointer; user-select: none; }
.tgl input { accent-color: var(--acc); }

/* ---------- 主布局 ---------- */
#layout { flex: 1 1 auto; display: flex; min-height: 0; }
#left {
  width: 232px; flex: 0 0 auto; background: var(--bg1);
  border-right: 1px solid var(--line); overflow-y: auto; padding: 10px;
}
#center { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
#right {
  width: 300px; flex: 0 0 auto; background: var(--bg1);
  border-left: 1px solid var(--line); overflow-y: auto; padding: 10px;
}
.panel-title { font-weight: 600; margin: 6px 0; color: var(--fg); }
.panel-title .dim { font-weight: 400; }

/* ---------- 模板网格 ---------- */
.cats { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.cat {
  font-size: 11px; padding: 3px 8px; border-radius: 10px; cursor: pointer;
  background: var(--bg2); border: 1px solid var(--line); color: var(--dim);
}
.cat.on { color: #fff; background: var(--acc); border-color: var(--acc); }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.cell {
  background: var(--bg2); border: 1px solid var(--line); border-radius: 6px;
  cursor: pointer; overflow: hidden; position: relative;
  transition: border-color .12s;
}
.cell:hover { border-color: var(--acc); }
.cell.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
.cell img { width: 100%; aspect-ratio: 1; display: block; image-rendering: pixelated; background: #0a0c10; }
.cell .nm {
  font-size: 11px; padding: 3px 5px; color: var(--fg); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.favs { display: flex; flex-direction: column; gap: 4px; }
.fav-item {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg2); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 8px; cursor: pointer; font-size: 12px;
}
.fav-item:hover { border-color: var(--acc); }
.fav-item .del { color: var(--dim); cursor: pointer; padding: 0 4px; }
.fav-item .del:hover { color: var(--danger); }

/* ---------- 预览区 ---------- */
#preview-wrap {
  flex: 1 1 auto; position: relative; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  background:
    repeating-conic-gradient(#151920 0% 25%, #1b2029 0% 50%) 0 0 / 24px 24px;
  overflow: hidden;
}
#preview {
  image-rendering: pixelated;
  box-shadow: 0 0 40px rgba(0,0,0,.55);
}
#hud {
  position: absolute; top: 8px; left: 8px; font-size: 11px;
  font-family: Consolas, monospace; color: var(--ok);
  background: rgba(10,12,16,.7); padding: 4px 8px; border-radius: 4px;
  pointer-events: none; line-height: 1.5; white-space: pre;
}
#nameplate {
  position: absolute; bottom: 8px; left: 10px; max-width: 70%;
  background: rgba(10,12,16,.7); padding: 4px 10px; border-radius: 4px;
  font-size: 12px; pointer-events: none;
}
#nameplate b { color: var(--acc); margin-right: 8px; }

/* ---------- 时间轴 ---------- */
#timeline { flex: 0 0 auto; background: var(--bg1); border-top: 1px solid var(--line); padding: 8px 12px; }
.tl-row { display: flex; align-items: center; gap: 8px; }
.tl-btn {
  background: var(--bg2); color: var(--fg); border: 1px solid var(--line);
  border-radius: 5px; width: 30px; height: 26px; cursor: pointer; font-size: 12px;
}
.tl-btn:hover { border-color: var(--acc); }
#speed { background: var(--bg2); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; height: 26px; }
#scrub-wrap { flex: 1 1 auto; position: relative; height: 26px; display: flex; align-items: center; }
#scrub { width: 100%; appearance: none; height: 6px; border-radius: 3px; background: var(--bg3); outline: none; }
#scrub::-webkit-slider-thumb {
  appearance: none; width: 12px; height: 20px; border-radius: 3px;
  background: var(--acc); cursor: ew-resize; border: 1px solid #fff3;
}
#frame-label { color: var(--dim); min-width: 72px; text-align: right; }

/* ---------- 右侧面板 ---------- */
details { background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; }
summary {
  padding: 7px 10px; cursor: pointer; font-weight: 600; user-select: none;
  color: var(--fg); list-style: none;
}
summary::before { content: "▸ "; color: var(--dim); }
details[open] summary::before { content: "▾ "; }
details .inner { padding: 4px 10px 10px; }
.row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
.lbl { color: var(--dim); font-size: 11px; }

button {
  font-family: inherit; font-size: 12px; color: var(--fg);
  background: var(--bg3); border: 1px solid var(--line); border-radius: 5px;
  padding: 5px 10px; cursor: pointer;
}
button:hover { border-color: var(--acc); }
button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
button.primary:hover { filter: brightness(1.1); }
button.mini { padding: 3px 7px; font-size: 11px; }
button.danger { color: var(--danger); border-color: #6a3040; }
button:disabled { opacity: .45; cursor: default; }
.exp { flex: 1 1 auto; }

input[type="text"], input[type="number"], textarea, select {
  font-family: inherit; font-size: 12px; color: var(--fg);
  background: var(--bg0); border: 1px solid var(--line); border-radius: 4px;
  padding: 4px 6px; outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--acc); }
textarea { width: 100%; resize: vertical; }
input[type="number"] { width: 5.5em; }
input[type="range"] { accent-color: var(--acc); }
input[type="checkbox"] { accent-color: var(--acc); }

/* 参数行 */
.p-row { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
.p-row .p-name { flex: 0 0 74px; color: var(--dim); font-size: 11px; }
.p-row input[type="range"] { flex: 1 1 auto; }
.p-row .p-val { flex: 0 0 44px; text-align: right; font-family: Consolas, monospace; font-size: 11px; }
.p-row .lock { cursor: pointer; color: var(--dim); padding: 0 2px; user-select: none; }
.p-row .lock.on { color: var(--warn); }
.ramp-swatches { display: flex; flex-wrap: wrap; gap: 3px; flex: 1 1 auto; }
.swatch {
  width: 22px; height: 14px; border-radius: 3px; cursor: pointer;
  border: 1px solid var(--line);
}
.swatch.on { outline: 2px solid var(--acc); }

/* 解析结果 */
#parse-result { margin-top: 6px; }
.parse-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.chip {
  font-size: 11px; padding: 2px 7px; border-radius: 9px;
  background: #1c3040; color: #9ecbff; border: 1px solid #2a4a66;
}
.chip.warn { background: #3a2a10; color: var(--warn); border-color: #5a4418; }
.chip.tpl { background: #26341c; color: #b0e08a; border-color: #3a5a28; }
.parse-unknown { color: var(--warn); font-size: 11px; margin-top: 3px; line-height: 1.5; }
.parse-ok { color: var(--ok); font-size: 11px; }

/* 组合器 */
.slot { background: var(--bg0); border: 1px solid var(--line); border-radius: 5px; padding: 6px; margin: 5px 0; }
.slot .row { margin: 3px 0; }
.slot select, .slot input { font-size: 11px; }
.slot input[type="number"] { width: 4.5em; }

/* 导出进度 */
#export-progress { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; }
#export-bar-track { flex: 1 1 auto; height: 8px; background: var(--bg0); border-radius: 4px; overflow: hidden; }
#export-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--acc), var(--acc2)); transition: width .1s; }
#export-links { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
#export-links a { color: var(--acc); font-size: 12px; text-decoration: none; }
#export-links a:hover { text-decoration: underline; }

/* toast */
#toast {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
  background: var(--bg3); border: 1px solid var(--acc); color: var(--fg);
  padding: 8px 18px; border-radius: 6px; z-index: 99; font-size: 13px;
  box-shadow: 0 4px 24px rgba(0,0,0,.5);
}
#toast.err { border-color: var(--danger); }

/* 滚动条 */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }

</style>
</head>
<body>
<header id="topbar">
  <div class="logo">◆ PixelForge <span class="sub" data-i18n="ui.tagline">特效工厂</span></div>
  <div class="badges">
    <span class="badge ok" data-i18n="badge.offline">完全离线</span>
    <span class="badge ok" data-i18n="badge.cpu">CPU 渲染</span>
    <span class="badge" data-i18n="badge.timebase">60 FPS 时间基 1/60</span>
  </div>
  <div class="topbtns">
    <label class="tgl"><input type="checkbox" id="tgl-shake" checked> <span data-i18n="top.shake">震屏</span></label>
    <label class="tgl"><input type="checkbox" id="tgl-flash"> <span data-i18n="top.reduceFlash">抑制剧烈闪烁</span></label>
    <label class="tgl"><input type="checkbox" id="tgl-stage"> <span data-i18n="top.stage">测试场</span></label>
    <button id="btn-stage-play" class="mini" data-i18n="top.attackTest" data-i18n-title="top.attackTestTip" title="播放一次攻击：前摇→命中→后摇">▶ 攻击测试</button>
    <button id="btn-hud" class="mini">HUD</button>
    <button id="btn-lang" class="mini" data-i18n="lang.toggle" data-i18n-title="lang.toggleTip" title="切换语言 / Switch language">🌐 EN</button>
  </div>
</header>

<main id="layout">
  <!-- 左：模板库 -->
  <aside id="left">
    <div class="panel-title"><span data-i18n="panel.templates">模板库</span> <span id="tpl-count" class="dim"></span></div>
    <div id="cats" class="cats"></div>
    <div id="grid" class="grid"></div>
    <div class="panel-title" data-i18n="panel.favs">收藏</div>
    <div id="favs" class="favs"><div class="dim small" data-i18n="favs.hint">在参数面板点 ☆ 收藏当前配方</div></div>
  </aside>

  <!-- 中：预览 -->
  <section id="center">
    <div id="preview-wrap">
      <canvas id="preview"></canvas>
      <div id="hud" class="hidden"></div>
      <div id="nameplate"><b id="np-name">—</b><span id="np-desc" class="dim"></span></div>
    </div>
    <div id="timeline">
      <div class="tl-row">
        <button id="btn-play" class="tl-btn" data-i18n-title="tl.playTip" title="播放/暂停">⏸</button>
        <button id="btn-prev" class="tl-btn" data-i18n-title="tl.prevTip" title="上一帧">⏮</button>
        <button id="btn-next" class="tl-btn" data-i18n-title="tl.nextTip" title="下一帧">⏭</button>
        <button id="btn-restart" class="tl-btn" data-i18n-title="tl.restartTip" title="回到起点">↺</button>
        <select id="speed" data-i18n-title="tl.speedTip" title="播放速度">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
        <div id="scrub-wrap">
          <input type="range" id="scrub" min="0" max="131" value="0" step="1">
          <div id="scrub-fill"></div>
        </div>
        <span id="frame-label" class="mono">0 / 132</span>
      </div>
    </div>
  </section>

  <!-- 右：配方 / 参数 / 导出 -->
  <aside id="right">
    <details id="recipe-box" open>
      <summary><span data-i18n="panel.recipe">文字配方</span> <span class="dim small" data-i18n="panel.recipeNote">（离线词典·支持范围有限）</span></summary>
      <div class="inner">
        <textarea id="recipe-input" rows="2" data-i18n-ph="recipe.placeholder" placeholder="例：蓝紫色环形爆炸，持续2秒，细碎火花"></textarea>
        <div class="row">
          <button id="btn-parse" class="primary" data-i18n="recipe.parse">解析并应用</button>
          <button id="btn-examples" class="mini" data-i18n="recipe.examples">示例</button>
        </div>
        <div id="parse-result"></div>
      </div>
    </details>

    <details id="param-box" open>
      <summary data-i18n="panel.params">参数</summary>
      <div class="inner">
        <div id="params"></div>
        <div class="row seed-row">
          <span class="lbl" data-i18n="param.seed">种子</span>
          <input type="number" id="seed" value="1">
          <button id="btn-dice" class="mini" title="🎲">🎲</button>
          <label class="tgl"><input type="checkbox" id="loop-tgl"> <span data-i18n="param.loop">循环</span></label>
        </div>
        <div class="row seed-row">
          <span class="lbl" data-i18n="param.canvas">画布</span>
          <select id="canvas-size">
            <option value="64">64</option>
            <option value="128">128</option>
            <option value="256" selected>256</option>
            <option value="512">512</option>
          </select>
          <span class="lbl" data-i18n="param.budget">预算</span>
          <input type="number" id="budget" value="1000" min="64" max="4000" step="50" data-i18n-title="param.budgetTip" title="活动粒子上限">
        </div>
        <div class="row">
          <button id="btn-variant" class="primary" data-i18n="param.variant">🎲 一键变体</button>
          <select id="variant-style" data-i18n-title="param.variantStyleTip" title="变体幅度">
            <option value="subtle" data-i18n="variant.subtle">轻微</option>
            <option value="normal" selected data-i18n="variant.normal">标准</option>
            <option value="wild" data-i18n="variant.wild">狂野</option>
          </select>
          <button id="btn-undo" class="mini" data-i18n="param.undo" data-i18n-title="param.undoTip" title="撤销">↶ 撤销</button>
          <button id="btn-fav" class="mini" data-i18n-title="param.favTip" title="收藏当前配方">☆</button>
        </div>
      </div>
    </details>

    <details id="combo-box">
      <summary><span data-i18n="panel.combo">组合器</span> <span class="dim small" data-i18n="panel.comboNote">（最多 4 层）</span></summary>
      <div class="inner">
        <div id="combo-slots"></div>
        <div class="row">
          <button id="btn-combo-apply" class="primary" data-i18n="combo.apply">应用组合</button>
          <button id="btn-combo-clear" class="mini" data-i18n="combo.clear">清除</button>
        </div>
      </div>
    </details>

    <details id="export-box" open>
      <summary data-i18n="panel.export">导出</summary>
      <div class="inner">
        <div class="row">
          <button id="exp-frame" class="exp" data-i18n="export.frame">单帧 PNG</button>
          <button id="exp-seq" class="exp" data-i18n="export.sequence">PNG 序列</button>
        </div>
        <div class="row">
          <button id="exp-apng" class="exp" data-i18n="export.apng">APNG 动图</button>
          <button id="exp-sheet" class="exp" data-i18n="export.sheet">Sprite Sheet</button>
        </div>
        <div class="row">
          <button id="exp-batch" class="exp" data-i18n="export.batch">批量导出分类</button>
          <button id="exp-recipe" class="exp" data-i18n="export.recipe">配方 JSON</button>
        </div>
        <div class="row small-row">
          <span class="lbl" data-i18n="export.maxPage">帧页上限</span>
          <select id="sheet-maxpage">
            <option value="1024">1024</option>
            <option value="2048">2048</option>
            <option value="4096" selected>4096</option>
          </select>
          <span class="lbl" data-i18n="export.padding">间距</span>
          <input type="number" id="sheet-pad" value="2" min="0" max="16" style="width:3.2em">
        </div>
        <div id="export-progress" class="hidden">
          <div id="export-bar-track"><div id="export-bar"></div></div>
          <span id="export-label" class="small"></span>
          <button id="export-cancel" class="mini danger" data-i18n="export.cancel">取消</button>
        </div>
        <div id="export-links"></div>
        <div class="dim small" style="margin-top:.4em" data-i18n="export.hint">
          序列默认 60 FPS · t=k/60 精确采样 · 透明通道 · 循环不重复首帧
        </div>
      </div>
    </details>
  </aside>
</main>

<div id="toast" class="hidden"></div>
<!-- inline: src/core/pf.js -->
<script>
/* PixelForge 特效工厂 —— 核心命名空间与工具
 * 版本 1.0.0  |  MIT License  |  完全离线、CPU优先、零依赖
 * 设计要点：所有热路径零对象分配（TypedArray + 复用），模拟与渲染分离。
 */
(function (root) {
  'use strict';
  const PF = {
    VERSION: '1.0.0',
    APP_NAME: 'PixelForge 特效工厂',
    /* 固定时间基：所有模拟以 1/60 秒步进；渲染插值只发生在位置层面 */
    DT: 1 / 60,
    FPS: 60,
    /* 默认粒子预算（全局活动粒子数上限，可由用户调整 200..4000） */
    DEFAULT_BUDGET: 1000,
    /* 画布支持尺寸 */
    CANVAS_SIZES: [64, 128, 256, 512],
    DEFAULT_CANVAS: 256,
  };

  /* ---------- 数学工具 ---------- */
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  const easeOutCubic = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const easeOutQuad = t => 1 - (1 - clamp(t, 0, 1)) * (1 - clamp(t, 0, 1));
  const easeInQuad = t => { t = clamp(t, 0, 1); return t * t; };
  /* 攻击-持续-释放包络：返回 0..1 */
  function env(t, attack, sustain, release) {
    if (t <= 0) return 0;
    const end = attack + sustain + release;
    if (t >= end) return 0;
    if (t < attack) return t / Math.max(attack, 1e-6);
    if (t < attack + sustain) return 1;
    return 1 - (t - attack - sustain) / Math.max(release, 1e-6);
  }
  /* 通用 0..1 包络（快起慢落） */
  function envFast(t, dur) { return env(t, Math.min(0.06, dur * 0.12), dur * 0.1, dur * 0.78); }

  /* ---------- 颜色工具（打包 RGB 为 int，避免对象分配） ---------- */
  function hexToInt(hex) {
    if (typeof hex === 'number') return hex & 0xFFFFFF;
    let h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return parseInt(h, 16) & 0xFFFFFF;
  }
  const R = c => (c >> 16) & 255, G = c => (c >> 8) & 255, B = c => c & 255;
  function mixInt(c1, c2, t) {
    const r = (R(c1) + (R(c2) - R(c1)) * t) | 0;
    const g = (G(c1) + (G(c2) - G(c1)) * t) | 0;
    const b = (B(c1) + (B(c2) - B(c1)) * t) | 0;
    return (r << 16) | (g << 8) | b;
  }
  function intToCss(c, a) {
    a = a === undefined ? 1 : a;
    return 'rgba(' + R(c) + ',' + G(c) + ',' + B(c) + ',' + a + ')';
  }
  function intToHex(c) {
    return '#' + (c & 0xFFFFFF).toString(16).padStart(6, '0');

<script>

      return { eff, start: clamp(it.start || 0, 0, 60), dur: clamp(it.dur || eff.durationSec, 0.1, 60), off: it.off || [0, 0], scale: clamp(it.scale || 1, 0.2, 2.5), ramp: it.ramp || null };
    });
    const totalDur = Math.max.apply(null, subs.map(s => s.start + s.dur));
    const combo = {
      kind: 'combo', subs, durationSec: totalDur,
      loop: !!config.loop,
      canvasSize: clamp(config.canvasSize === undefined ? PF.DEFAULT_CANVAS : config.canvasSize, 16, 512) | 0,
      maxActive: subs.reduce((a, s) => a + s.eff.maxActive, 0),
      config,
      frameCount() { return Math.max(2, Math.round(totalDur * PF.FPS)); },
      timeOfFrame(k) { return k / PF.FPS; },
      renderFrame(n, R, opts) {
        R.clear();
        this.renderLocal(n * PF.DT, R, opts);
      },
      renderLocal(t, R, opts) {
        for (const s of subs) {
          const lt = t - s.start;
          if (lt < 0 || lt > s.dur) continue;
          if (s.scale !== 1 || s.off[0] !== 0 || s.off[1] !== 0) {
            R.pushTransform(s.off[0], s.off[1], s.scale);
            s.eff.renderLocal(lt, R, opts);
            R.popTransform();
          } else {
            s.eff.renderLocal(lt, R, opts);
          }
        }
      },
      thumbTime() { return totalDur * 0.4; },
      shakeOffset(t, out) { out[0] = out[1] = 0; return out; },
    };
    return combo;
  }

  PF.validateParams = validateParams;
  PF.resolveRamp = resolveRamp;
  PF.makeEffect = makeEffect;
  PF.makeCombo = makeCombo;
  PF.recipeToJSON = recipeToJSON;
  PF.recipeFromJSON = recipeFromJSON;
  if (typeof module !== 'undefined' && module.exports) module.exports = PF;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>

<script>
/* PixelForge —— 生成器模板库（26 个）
 * 每个模板都有明确的阶段结构（前摇/爆发/扩散/余波 或 持续发射/消散），
 * 换色板不构成新模板。参数均通过 schema 校验。
 * 时间设计以 durationSec 的比例表达，保证 0.8s..4s 内阶段比例一致。
 */
(function (root) {
  'use strict';
  const PF = root.PF || require('./pf.js');
  const palette = (root.PF && root.PF.palette) ? root.PF.palette : require('./palette.js');
  const T = PF.TEMPLATES;
  const R = palette.R;
  const HALF_PI = Math.PI / 2, PI = Math.PI;

  /* 快捷 schema 构造 */
  const P = {
    range: (key, label, min, max, def, step) => ({ key, label, type: 'range', min, max, default: def, step: step || 0.01 }),
    ramp: (key, label, def, opts) => ({ key, label, type: 'ramp', default: def, options: opts }),
    angle: (key, label, def) => ({ key, label, type: 'angle', default: def }),
    bool: (key, label, def) => ({ key, label, type: 'bool', default: !!def }),
  };
  const COMMON_RAMPS = Object.keys(R);

  function reg(def) { T[def.id] = def; }

  /* ================================================================
   *  1. 魔法爆炸 —— 起势(内聚) → 爆发(闪+环) → 扩散(碎片火花) → 余波(余烬+烟)
   * ================================================================ */
  reg({
    id: 'magic_explosion', name: '魔法爆炸', category: 'explosion', loop: false, duration: 2.2,

      P.range('scale', '整体尺寸', 0.5, 2, 1),

      P.ramp('color', '色板', 'magicBlue', COMMON_RAMPS),

        shake: { t0: 0.36 * q, amp: 0.02 * S * I, freq: 9, dur: 0.5 * q },
        meta: { thumbTime: 0.42 * q },
        layers: [
          /* 起势：向心内聚 + 渐亮底光 */
          { type: 'swirl', t0: 0, t1: 0.34 * q, count: 30 * I | 0, r: 0.55 * S, w: 5, dir: 1, converge: 0.9 * S, trailK: 0.1, size0: [0.008, 0.016], size1: [0.012, 0.02], glow: 0.9, ramp },
          { type: 'glowspot', t0: 0, t1: 0.36 * q, r: 0.2 * S, alpha: 0.55 * I, pulse: 7, glow: 1.2, ramp },
          /* 爆发：复合闪光（白核→主色→外晕），环慢起从闪光中突破 */
          { type: 'flash', t0: 0.36 * q, t1: 0.52 * q, r: 0.55 * S, alpha: 0.92, glow: 1.7 * I, ramp },
          { type: 'glowspot', t0: 0.36 * q, t1: 0.8 * q, r: 0.28 * S, alpha: 0.5 * I, glow: 1.1, ramp },
          { type: 'ring', t0: 0.36 * q, t1: 0.9 * q, r0: 0.06, r1: 0.92 * S, halfW: 0.045, halfW1: 0.016, attack: 0.1, alpha: 0.92, glow: 1.3 * I, ramp },
          { type: 'ring', t0: 0.46 * q, t1: 0.95 * q, r0: 0.04, r1: 0.58 * S, halfW: 0.02, halfW1: 0.008, alpha: 0.5, glow: 0.9 * I, ramp },
          /* 扩散：碎片(自旋长条) + 火花(拉伸) */
          { type: 'burst', t0: 0.36 * q, count: 30 * I | 0, kind: 2, spin: 9, jitter: 0.05, spread: PI * 2, spd: [0.5 * S, 1.5 * S], spdPow: 1.2, drag: 1.9, grav: 1.1, life: [0.5, 1.0], size0: [0.018, 0.036], size1: [0.006, 0.014], glow: 1.0, mode: 1, ramp },
          { type: 'burst', t0: 0.36 * q, count: 56 * I | 0, kind: 1, jitter: 0.04, spread: PI * 2, spd: [0.9 * S, 2.3 * S], spdPow: 1.7, drag: 2.6, grav: 0.4, life: [0.3, 0.75], size0: [0.01, 0.024], size1: [0.003, 0.008], flicker: 0.5, glow: 1.5, ramp },
          { type: 'burst', t0: 0.36 * q, count: 14 * I | 0, kind: 1, jitter: 0.02, spread: PI * 2, spd: [2.2 * S, 4.4 * S], spdPow: 1.2, drag: 2.0, life: [0.1, 0.24], size0: [0.006, 0.012], size1: [0.002, 0.004], glow: 1.6, mode: 1, ramp },

  reg({

    build(p, pal) {

      const ramp = pal.resolveRamp(p.color);

        meta: { thumbTime: 0.2 * q },
        layers: [
          { type: 'flash', t0: 0, t1: 0.14 * q, r: 0.4 * S, glow: 1.4 * I, ramp },
          /* 火球主体：慢速膨胀的大颗粒 */
          { type: 'burst', t0: 0, count: 26 * I | 0, spread: PI * 2, spd: [0.25 * S, 0.75 * S], drag: 2.8, life: [0.35, 0.7], size0: [0.06, 0.1], size1: [0.14, 0.22], sizePow: 0.6, jitter: 0.05, glow: 1.1, mode: 1, fadePow: 1.2, ramp },
          /* 火舌：向上喷流 */
          { type: 'vstream', t0: 0, t1: 0.5 * q, rate: 55 * I, warm: false, pos: [0, 0.05], angle: -HALF_PI, spread: 0.7, spd: [0.6 * S, 1.5 * S], drag: 1.6, life: [0.3, 0.55], size0: [0.03, 0.06], size1: [0.1, 0.16], jitter: 0.06, driftA: 0.08, flicker: 0.35, glow: 1.1, ramp },
          /* 火星 */
          { type: 'burst', t0: 0.02 * q, count: 34 * I | 0, kind: 1, spread: PI * 2, spd: [0.8 * S, 2.1 * S], spdPow: 1.5, drag: 2.2, grav: 0.7, life: [0.3, 0.65], size0: [0.006, 0.014], size1: [0.002, 0.004], flicker: 0.6, glow: 1.3, ramp },
          { type: 'ring', t0: 0.05 * q, t1: 0.5 * q, r0: 0.05, r1: 0.6 * S, halfW: 0.03, halfW1: 0.012, alpha: 0.75, glow: 1.0, ramp },
          /* 浓烟余波 */
          { type: 'vstream', t0: 0.35 * q, t1: 1.2 * q, rate: 13 * I, warm: false, pos: [0, 0.05 * S], spread: PI * 2, spd: [0.04, 0.16], drag: 0.6, grav: -0.35, life: [0.7, 1.2], size0: [0.06, 0.1], size1: [0.18, 0.28], jitter: 0.1, driftA: 0.12, glow: 0.05, mode: 0, fadePow: 1.5, ramp: pal.R.smoke },

  /* ================================================================
   *  3. 雷霆一击 —— 蓄能微光 → 落雷(分叉) → 命中闪环 → 余辉

  reg({
    id: 'lightning_strike', name: '雷霆一击', category: 'lightning', loop: false, duration: 1.5,

    params: [
      P.range('scale', '整体尺寸', 0.5, 2, 1),

          { type: 'flash', t0: 0.38 * q, t1: 0.62 * q, pos: g, r: 0.6 * S, glow: 1.5 * I, ramp },
          { type: 'ring', t0: 0.38 * q, t1: 1.05 * q, pos: [0, 0.45 * S], r0: 0.05, r1: 0.9 * S, halfW: 0.045, halfW1: 0.018, squishY: 0.28, glow: 1.3 * I, ramp },
          { type: 'ring', t0: 0.5 * q, t1: 1.2 * q, pos: [0, 0.45 * S], r0: 0.03, r1: 0.6 * S, halfW: 0.022, halfW1: 0.01, squishY: 0.28, alpha: 0.75, glow: 1.0, ramp },
          { type: 'vstream', t0: 0.45 * q, t1: 1.7 * q, rate: 22 * I, warm: false, pos: [0, 0.35 * S], spread: PI * 2, spd: [0.15, 0.5], drag: 0.8, grav: -0.55, life: [0.7, 1.2], size0: [0.006, 0.014], size1: [0.004, 0.01], jitter: 0.3, flicker: 0.4, glow: 1.0, ramp },
          { type: 'burst', t0: 0.38 * q, count: 20 * I | 0, kind: 1, pos: g, spread: PI * 2, spd: [0.3, 0.9], drag: 2.2, grav: 0.2, life: [0.4, 0.8], size0: [0.006, 0.012], size1: [0.002, 0.005], glow: 1.1, ramp },

          { type: 'burst', t0: 0.3 * q, count: 10 * I | 0, kind: 2, spin: 10, spread: PI * 2, spd: [0.3 * S, 1.0 * S], drag: 1.8, grav: 1.0, life: [0.35, 0.7], size0: [0.01, 0.018], size1: [0.003, 0.007], glow: 0.8, ramp },

  /* ================================================================
   *  7. 重锤命中 —— 接触闪 + 快环 + 定向碎片 + 落尘
   * ================================================================ */

          { type: 'burst', t0: 0.05 * q, count: 26 * I | 0, kind: 1, angle: -HALF_PI, spread: 2.2, spd: [0.2 * S, 0.9 * S], drag: 1.4, grav: -0.5, life: [0.35, 0.75], size0: [0.007, 0.014], size1: [0.003, 0.006], flicker: 0.5, glow: 1.4, ramp },

  /* ================================================================
   * 26. 升级之柱 —— 上升光柱 + 环带 + 顶部爆发
   * ================================================================ */
  reg({
    id: 'levelup_pillar', name: '升级之柱', category: 'ui', loop: false, duration: 1.9,
    desc: '角色升级：光柱自下而上推进，环带上升，顶部星屑爆发。',
    params: [
      P.range('scale', '整体尺寸', 0.5, 2, 1),
      P.range('intensity', '强度', 0.4, 2, 1),
      P.range('durationSec', '持续时间(秒)', 1, 3.5, 1.9),
      P.ramp('color', '色板', 'holy', COMMON_RAMPS),
    ],
    build(p, pal) {
      const D = p.durationSec, S = p.scale, I = p.intensity;
      const ramp = pal.resolveRamp(p.color);
      const q = D / 1.9;
      const bands = [];
      for (let i = 0; i < 3; i++) {
        bands.push({ type: 'ring', t0: (0.1 + i * 0.22) * q, t1: (0.6 + i * 0.22) * q, pos: [0, 0], r0: 0.1 * S, r1: 0.38 * S, halfW: 0.022, halfW1: 0.01, squishY: 0.22, alpha: 0.65, glow: 0.9, ramp });
      }
      return {
        meta: { thumbTime: 0.55 * q },
        layers: [
          { type: 'glowspot', t0: 0, t1: 0.35 * q, pos: [0, 0.5 * S], r: 0.22 * S, alpha: 0.4 * I, pulse: 6, glow: 1.0, ramp },
          { type: 'beam', t0: 0.3 * q, t1: 1.25 * q, from: [0, 0.6 * S], to: [0, -0.95], width: 0.14 * S, width1: 0.05, grow: 0.35, attack: 0.08, glow: 1.3 * I, ramp },
          ...bands,
          { type: 'vstream', t0: 0.3 * q, t1: 1.3 * q, rate: 30 * I, warm: false, pos: [0, 0.5 * S], spread: PI * 2, spd: [0.2, 0.6], drag: 0.6, grav: -0.8, life: [0.5, 1.0], size0: [0.006, 0.014], size1: [0.005, 0.011], jitter: 0.18, flicker: 0.4, glow: 1.0, ramp },
          { type: 'flash', t0: 1.15 * q, t1: 1.4 * q, pos: [0, -0.55], r: 0.4 * S, glow: 1.4 * I, ramp },
          { type: 'burst', t0: 1.15 * q, count: 30 * I | 0, kind: 2, pos: [0, -0.55], spin: 8, spread: PI * 2, spd: [0.3 * S, 1.2 * S], drag: 1.6, grav: 0.9, life: [0.4, 0.8], size0: [0.01, 0.02], size1: [0.004, 0.008], glow: 1.0, ramp },
          { type: 'ring', t0: 1.16 * q, t1: 1.7 * q, pos: [0, -0.55], r0: 0.05, r1: 0.55 * S, halfW: 0.03, halfW1: 0.012, glow: 1.1 * I, ramp },
        ],
      };
    },
  });

  /* ================================================================
   *  27. 火焰龙卷 —— 底部旋涡 → 上升火柱 → 顶端爆散余烬
   * ================================================================ */
  reg({
    id: 'fire_whirl', name: '火焰龙卷', category: 'fire', loop: false, duration: 1.8,
    desc: '地面旋涡卷起火柱冲天，顶端爆出余烬，带轻微热浪抖动。',
    params: [
      P.range('scale', '整体尺寸', 0.5, 2, 1),
      P.range('intensity', '强度', 0.4, 2, 1),
      P.range('durationSec', '持续时间(秒)', 1, 3, 1.8),
      P.range('height', '柱体高度', 0.6, 1.6, 1),
      P.ramp('color', '色板', 'fire', COMMON_RAMPS),
    ],
    build(p, pal) {
      const D = p.durationSec, S = p.scale, I = p.intensity;
      const ramp = pal.resolveRamp(p.color);
      const q = D / 1.8;
      const base = [0, 0.55 * S];
      const top = [0, 0.55 * S - 1.15 * p.height * S];
      return {
        shake: { t0: 0.25 * q, amp: 0.012 * S * I, freq: 7, dur: 1.2 * q },
        meta: { thumbTime: 0.75 * q },
        layers: [
          { type: 'glowspot', t0: 0, t1: 1.4 * q, pos: base, r: 0.3 * S, alpha: 0.5 * I, pulse: 5, glow: 1.2, ramp },
          /* 底部主旋涡：双圈反向搅动 */
          { type: 'swirl', t0: 0.05 * q, t1: 1.45 * q, count: 26 * I | 0, pos: base, r: 0.34 * S, w: 6, trailK: 0.28, size0: [0.012, 0.024], size1: [0.02, 0.035], glow: 1.1 * I, ramp },
          { type: 'swirl', t0: 0.1 * q, t1: 1.4 * q, count: 14 * I | 0, pos: base, r: 0.18 * S, w: 9, dir: -1, trailK: 0.2, size0: [0.01, 0.02], size1: [0.016, 0.028], glow: 1.2 * I, ramp },
          /* 上升火柱：窄角向上持续发射 */
          { type: 'vstream', t0: 0.18 * q, t1: 1.35 * q, rate: 46 * I, warm: false, pos: base, angle: -HALF_PI, spread: 0.4, spd: [1.1 * S, 2.2 * S * p.height], drag: 0.75, grav: -0.55, life: [0.45, 0.8], size0: [0.012, 0.024], size1: [0.03, 0.055], jitter: 0.06, flicker: 0.35, glow: 1.3 * I, ramp },
          /* 顶端碎火与余烬 */
          { type: 'burst', t0: 0.5 * q, count: 22 * I | 0, kind: 1, pos: top, angle: -HALF_PI, spread: PI * 1.4, spd: [0.3 * S, 1.1 * S], spdPow: 1.3, drag: 1.8, grav: 0.5, life: [0.3, 0.7], size0: [0.008, 0.016], size1: [0.003, 0.007], flicker: 0.55, glow: 1.4, ramp },
          { type: 'burst', t0: 0.55 * q, count: 12 * I | 0, kind: 2, pos: top, spin: 9, spread: PI * 2, spd: [0.15 * S, 0.7 * S], drag: 1.4, grav: 0.7, life: [0.4, 0.8], size0: [0.01, 0.02], size1: [0.004, 0.008], glow: 1.0, ramp },
          { type: 'flash', t0: 0.4 * q, t1: 0.6 * q, pos: top, r: 0.3 * S, alpha: 0.7, glow: 1.2 * I, ramp },
          /* 淡烟 */
          { type: 'vstream', t0: 0.7 * q, t1: 1.6 * q, rate: 10 * I, warm: false, pos: top, spread: PI * 2, spd: [0.04, 0.16], drag: 0.7, grav: -0.4, life: [0.6, 1.0], size0: [0.05, 0.09], size1: [0.16, 0.24], jitter: 0.12, driftA: 0.1, alpha: 0.22, glow: 0.05, mode: 0, fadePow: 1.6, ramp: pal.R.smoke },
        ],

  /* ================================================================
   *  28. 冰霜新星 —— 蓄能 → 白炽爆心 → 双重冰环 → 碎冰四射
   * ================================================================ */
  reg({
    id: 'frost_nova', name: '冰霜新星', category: 'water', loop: false, duration: 1.3,

      P.range('intensity', '强度', 0.4, 2, 1),

      P.ramp('color', '色板', 'ice', COMMON_RAMPS),

    build(p, pal) {
      const D = p.durationSec, S = p.scale, I = p.intensity;
      const ramp = pal.resolveRamp(p.color);
      const q = D / 1.3;
      return {
        shake: { t0: 0.32 * q, amp: 0.02 * S * I, freq: 10, dur: 0.4 * q },
        meta: { thumbTime: 0.36 * q },
        layers: [
          /* 蓄能：向心寒气 */
          { type: 'swirl', t0: 0, t1: 0.3 * q, count: 20 * I | 0, pos: [0, 0], r: 0.4 * S, w: 6, dir: -1, converge: 0.8 * S, trailK: 0.12, size0: [0.008, 0.015], size1: [0.012, 0.02], glow: 1.0, ramp },
          { type: 'glowspot', t0: 0, t1: 0.32 * q, r: 0.2 * S, alpha: 0.5 * I, pulse: 8, glow: 1.2, ramp },
          /* 爆心 */
          { type: 'flash', t0: 0.32 * q, t1: 0.5 * q, r: 0.5 * S, alpha: 0.95, glow: 1.6 * I, ramp },
          /* 双重冰环：外快内慢 */
          { type: 'ring', t0: 0.32 * q, t1: 0.85 * q, r0: 0.05, r1: 0.9 * S, halfW: 0.04, halfW1: 0.014, attack: 0.08, alpha: 0.9, glow: 1.3 * I, ramp },
          { type: 'ring', t0: 0.42 * q, t1: 1.05 * q, r0: 0.03, r1: 0.6 * S, halfW: 0.026, halfW1: 0.01, alpha: 0.55, glow: 0.9 * I, ramp },
          /* 碎冰四射：拉伸碎片 + 自旋大块 */
          { type: 'burst', t0: 0.32 * q, count: 34 * I | 0, kind: 1, spread: PI * 2, spd: [0.7 * S, 2.1 * S], spdPow: 1.5, drag: 2.1, grav: 0.5, life: [0.25, 0.6], size0: [0.008, 0.018], size1: [0.002, 0.006], flicker: 0.4, glow: 1.3, ramp },
          { type: 'burst', t0: 0.36 * q, count: 14 * I | 0, kind: 2, spin: 10, spread: PI * 2, spd: [0.3 * S, 1.0 * S], drag: 1.5, grav: 0.9, life: [0.4, 0.85], size0: [0.012, 0.024], size1: [0.005, 0.01], glow: 0.9, ramp },
          /* 冷雾消散 */
          { type: 'vstream', t0: 0.5 * q, t1: 1.1 * q, rate: 16 * I, warm: false, pos: [0, 0.08 * S], spread: PI * 2, spd: [0.05, 0.22], drag: 0.8, grav: -0.25, life: [0.5, 0.9], size0: [0.05, 0.09], size1: [0.14, 0.2], jitter: 0.12, driftA: 0.08, alpha: 0.3, glow: 0.06, mode: 0, fadePow: 1.6, ramp: pal.makeRamp(['#0a1828', '#14304a', '#285a78', '#4888a8']) },
        ],
      };
    },
  });

  /* ================================================================
   *  29. 冲刺残影 —— 多重拖影横扫 → 头部闪光 → 收尾火花
   * ================================================================ */
  reg({
    id: 'dash_trail', name: '冲刺残影', category: 'hit', loop: false, duration: 0.8,
    desc: '角色朝指定方向高速冲刺，拖出多重残影，终点闪光与逆向火花。',
    params: [
      P.range('scale', '整体尺寸', 0.5, 2, 1),
      P.range('intensity', '强度', 0.4, 2, 1),
      P.range('durationSec', '持续时间(秒)', 0.5, 1.5, 0.8),
      P.angle('angle', '方向(度)'),
      P.ramp('color', '色板', 'slash', COMMON_RAMPS),
    ],
    build(p, pal) {
      const D = p.durationSec, S = p.scale, I = p.intensity;
      const ramp = pal.resolveRamp(p.color);
      const q = D / 0.8;
      const a = (p.angle || 0) * PI / 180;
      const dir = [Math.cos(a), Math.sin(a)];
      const from = [-0.72 * S * dir[0], -0.72 * S * dir[1]];
      const to = [0.62 * S * dir[0], 0.62 * S * dir[1]];
      const back = a + PI;
      return {
        shake: { t0: 0.05 * q, amp: 0.014 * S * I, freq: 14, dur: 0.4 * q },
        meta: { thumbTime: 0.4 * q },
        layers: [
          /* 三重拖影：宽度与亮度递减、时序错开 */
          { type: 'beam', t0: 0, t1: 0.5 * q, from, to, width: 0.075 * S, width1: 0.028, grow: 0.55, attack: 0.05, alpha: 0.95, glow: 1.2 * I, ramp },
          { type: 'beam', t0: 0.05 * q, t1: 0.55 * q, from, to, width: 0.05 * S, width1: 0.018, grow: 0.4, attack: 0.05, alpha: 0.6, glow: 0.9 * I, ramp },
          { type: 'beam', t0: 0.1 * q, t1: 0.62 * q, from, to, width: 0.03 * S, width1: 0.01, grow: 0.3, attack: 0.05, alpha: 0.35, glow: 0.6 * I, ramp },
          /* 头部闪光与终点小环 */
          { type: 'flash', t0: 0.28 * q, t1: 0.48 * q, pos: to, r: 0.3 * S, alpha: 0.85, glow: 1.4 * I, ramp },
          { type: 'ring', t0: 0.32 * q, t1: 0.72 * q, pos: to, r0: 0.03, r1: 0.3 * S, halfW: 0.022, halfW1: 0.008, alpha: 0.6, glow: 0.9 * I, ramp },
          /* 逆向火花与速度线 */
          { type: 'burst', t0: 0.05 * q, count: 24 * I | 0, kind: 1, pos: from, angle: back, spread: 0.9, spd: [0.8 * S, 2.0 * S], spdPow: 1.4, drag: 2.6, life: [0.15, 0.35], size0: [0.006, 0.013], size1: [0.002, 0.005], flicker: 0.5, glow: 1.2, ramp },
          { type: 'vstream', t0: 0.02 * q, t1: 0.45 * q, rate: 22 * I, warm: false, pos: [from[0] * 0.6, from[1] * 0.6], angle: back, spread: 0.5, spd: [1.2 * S, 2.4 * S], drag: 2.4, life: [0.12, 0.28], size0: [0.005, 0.011], size1: [0.004, 0.009], glow: 0.8, ramp },
          /* 起点淡出底光 */
          { type: 'glowspot', t0: 0, t1: 0.4 * q, pos: from, r: 0.18 * S, alpha: 0.3, glow: 0.8, ramp },
        ],
      };
    },
  });

  /* 统计 */
  reg.count = Object.keys(T).length;
  if (typeof module !== 'undefined' && module.exports) module.exports = T;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>

  const EN_COLOR = {

    'blue': '#3a6cf0', 'deep blue': '#1a2a9a', 'dark blue': '#1a2a9a', 'blue violet': '#7a4aff', 'blue-violet': '#7a4aff',

    if (schemaMap.angle && modCtx.angle !== undefined) params.angle = modCtx.angle;

    for (const [words] of SUBJECTS) {

        const i = findWord(rest, w);
        if (i >= 0) { rest = rest.slice(0, i) + ' ' + rest.slice(i + w.length); res.matched.push({ token: w, meaning: { k: 'rel', v: w } }); }

  }

  function leftoverTokens(rest) {
    const out = [];
    for (const tk of rest.split(/[\s,，。.、!！?？;；:：]+/)) {

    }
    return out;
  }

    '蓝紫色环形爆炸，持续2秒，细碎火花，透明背景',
    '橙红色火焰爆炸，快速',
    '暴击命中，巨大，强烈',
    '金色升级光柱，3秒',
    '闪电，蓝白色，分叉',
    '循环的火把火焰',
    '暴雨，风大',
    '寒冰碎裂，浅蓝',
    'blue-violet ring explosion, 2s, fine sparks, transparent background',
    'orange-red fireball explosion, fast',
    'critical hit, huge, intense',
    'golden level up pillar, 3 seconds',
    'looping torch flame',
    'rainstorm, strong wind',

<script>
/* PixelForge —— 一键变体引擎
 * 合理扰动参数与种子，保留用户锁定项。
 * 规则：种子必换；解锁参数 60% 在合法范围内随机、40% 在当前值附近抖动；
 * 色板仅在未锁定时换；循环模板不扰动 duration（无该参数）。
 */
(function (root) {
  'use strict';
  const PF = root.PF || require('./pf.js');
  const rngMod = (root.PF && root.PF.rng) ? root.PF.rng : require('./rng.js');
  const palette = (root.PF && root.PF.palette) ? root.PF.palette : require('./palette.js');

  function randRange(a, b) { return a + Math.random() * (b - a); }

  function mutate(config, locks) {
    locks = locks || {};
    const def = PF.TEMPLATES[config.template];
    if (!def) throw new Error('模板不存在');
    const params = {};
    for (const s of def.params) {
      const cur = (config.params && config.params[s.key] !== undefined) ? config.params[s.key] : s.default;
      if (locks[s.key]) { params[s.key] = cur; continue; }
      if (s.type === 'range') {
        params[s.key] = Math.random() < 0.6
          ? randRange(s.min, s.max)
          : PF.clamp(cur + (Math.random() - 0.5) * (s.max - s.min) * 0.4, s.min, s.max);
        if (s.step >= 1) params[s.key] = Math.round(params[s.key]);
      } else if (s.type === 'ramp') {
        const opts = (s.options && s.options.length ? s.options : Object.keys(palette.R));
        params[s.key] = opts[(Math.random() * opts.length) | 0];
      } else if (s.type === 'angle') {
        params[s.key] = Math.round(randRange(0, 359));
      } else if (s.type === 'bool') {
        params[s.key] = Math.random() < 0.3 ? !cur : cur;
      } else if (s.type === 'select') {
        params[s.key] = s.options[(Math.random() * s.options.length) | 0];
      } else {
        params[s.key] = cur;
      }
    }
    return {
      template: config.template,
      params,
      seed: rngMod.randomSeed(),
      loop: config.loop,
      budget: config.budget,
      canvasSize: config.canvasSize,
    };
  }

  /* 扰动强度档位：subtle / normal / wild */
  function mutateStyled(config, locks, style) {
    const out = mutate(config, locks);
    if (style === 'subtle') {
      /* 向默认值收敛一半 */
      const def = PF.TEMPLATES[out.template];
      for (const s of def.params) {
        if (s.type === 'range' && !locks[s.key]) {
          const dflt = s.default;
          out.params[s.key] = (out.params[s.key] + dflt) / 2;
        } else if (s.type === 'ramp' && !locks[s.key]) {
          const cur = (config.params && config.params[s.key]) || s.default;
          out.params[s.key] = cur; /* subtle 保留原色板 */
        }
      }
    }
    return out;
  }

    if (globalThis.PF) globalThis.PF.variant = VARIANT;
  }

<script>
/* PixelForge —— 极简测试场
 * 稻草假人 + 简易攻击者剪影 + 60FPS 包络动画（前摇→命中→后摇）。
 * 不是战斗游戏：只提供“效果挂在谁身上”的参照物。
 * 全部用光栅算子绘制（扁色 stamp/beam），参与同一渲染管线与震屏变换。
 */
(function (root) {
  'use strict';
  const PF = root.PF || require('./pf.js');

  const GROUND = 0.62;          // 地面 y（世界坐标，向下为正）
  const DX = 0.42;              // 假人 x
  const HX = -0.55;             // 攻击者 x
  const WINDUP = 0.42;          // 前摇时长
  const RECOVER = 1.0;          // 后摇时长

  /* 一段攻击的时间轴状态：t 相对触发时刻 */
  function phase(t) {
    if (t < 0) return { name: 'idle', k: 0 };
    if (t < WINDUP) return { name: 'windup', k: t / WINDUP };
    if (t < WINDUP + 0.05) return { name: 'hit', k: (t - WINDUP) / 0.05 };
    if (t < WINDUP + RECOVER) return { name: 'recover', k: (t - WINDUP) / RECOVER };
    return { name: 'idle', k: 0 };
  }

  /* 绘制：t 为相对攻击触发的时间（负数=未触发） */
  function draw(R, t, opts) {
    opts = opts || {};
    const ph = phase(t);
    const lerp = PF.lerp, eo = PF.easeOutQuad;
    /* ---- 地面 ---- */
    R.beam(-1, GROUND + 0.06, 1, GROUND + 0.06, 0.012, 0x2c313c, 0.8, 0, 0);
    R.beam(-1, GROUND + 0.065, 1, GROUND + 0.065, 0.004, 0x3c424e, 0.35, 0, 0);

    /* ---- 假人（命中后轻微后仰+回弹） ---- */
    let lean = 0, kx = 0;
    if (ph.name === 'hit') { lean = 0.5 * ph.k; kx = 0.06 * ph.k; }
    else if (ph.name === 'recover') { lean = 0.5 * Math.exp(-ph.k * 4) * Math.cos(ph.k * 14); kx = 0.06 * Math.exp(-ph.k * 4) * Math.cos(ph.k * 10); }
    const dx = DX + kx;
    const straw = 0xb09048, strawD = 0x7a6330, rope = 0x5a4620;
    /* 支架 */
    R.beam(dx, GROUND, dx, GROUND - 0.28, 0.014, 0x4a4038, 1, 0, 0);
    /* 身体：两段倾斜胶囊 */
    const by = GROUND - 0.28;
    const bx2 = dx + Math.sin(lean) * 0.16, by2 = by - Math.cos(lean) * 0.26;
    R.beam(dx, by, bx2, by2, 0.075, straw, 1, 0, 0);
    R.beam(dx, by + 0.02, bx2, by2 + 0.02, 0.05, strawD, 0.5, 0, 0);
    /* 头 */
    R.stamp(bx2 + Math.sin(lean) * 0.05, by2 - 0.09, 0.075, straw, 1, 0, 0);
    R.stamp(bx2 + Math.sin(lean) * 0.05 - 0.02, by2 - 0.11, 0.045, strawD, 0.6, 0, 0);
    /* 绑绳 */
    R.beam(dx - 0.05 + Math.sin(lean) * 0.08, by - 0.08, dx + 0.05 + Math.sin(lean) * 0.08, by - 0.1, 0.014, rope, 1, 0, 0);
    /* 命中白闪 */
    if (ph.name === 'hit') R.stamp(dx, by - 0.15, 0.22, 0xffffff, 0.7 * (1 - ph.k), 0.5, 1);

    /* ---- 攻击者剪影 ---- */
    /* 前摇：手臂举起蓄力；命中瞬间：手臂前伸 */
    let arm = 0, step = 0;
    if (ph.name === 'windup') { arm = -0.5 * Math.sin(ph.k * Math.PI); step = 0.05 * ph.k; }
    else if (ph.name === 'hit') { arm = 0.22; step = 0.1; }
    else if (ph.name === 'recover') { arm = 0.22 * (1 - ph.k); step = 0.1 * (1 - ph.k); }
    const hx = HX + step;
    const body = 0x3a4252, bodyD = 0x272d3a;
    R.beam(hx, GROUND, hx, GROUND - 0.3, 0.06, body, 1, 0, 0);           // 腿/躯干
    R.beam(hx, GROUND - 0.18, hx + 0.03, GROUND - 0.42, 0.05, bodyD, 1, 0, 0); // 上身
    R.stamp(hx + 0.03, GROUND - 0.5, 0.06, body, 1, 0, 0);               // 头
    /* 武器臂：从肩到手的线，蓄力时上举后摆，命中时前指 */
    const sx = hx + 0.03, sy = GROUND - 0.38;
    const hax = sx + 0.16 + arm * 0.5, hay = sy + arm * 0.35 - (ph.name === 'windup' ? Math.abs(arm) * 0.25 : 0);
    R.beam(sx, sy, hax, hay, 0.018, body, 1, 0, 0);
    /* 武器（短剑线） */
    const wax = hax + 0.14 + (ph.name === 'windup' ? 0 : 0.06), way = hay - 0.1 + (ph.name === 'windup' ? arm * 0.3 : 0);
    R.beam(hax, hay, wax, way, 0.012, 0x9aa4b8, 1, 0.2, 0);
    /* 蓄力微光 */
    if (ph.name === 'windup' && opts.glow !== false) {
      R.stamp(sx + 0.1, sy - 0.05, 0.1 * ph.k, 0xd8e4ff, 0.25 * ph.k, 0.6, 1);
    }
  }

  const STAGE = { draw, phase, GROUND, DX, HX, WINDUP, RECOVER };
  if (typeof globalThis !== 'undefined') {
    globalThis.PF_STAGE = STAGE;
    if (globalThis.PF) globalThis.PF.stage = STAGE;
  }
  if (typeof module !== 'undefined' && module.exports) module.exports = STAGE;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>

<script>
/* PixelForge —— PNG 编码器（零依赖，RGBA8）

   * 内存策略：逐帧「渲染→压缩→只保留压缩字节」，原始帧不驻留（与序列 ZIP 同一纪律）。
   * w/h：全画布尺寸；total：帧数；getFrame(k)：返回第 k 帧 RGBA（w*h*4），
   *      返回 null/undefined 表示提前取消 → 结果 { cancelled:true, frames:k }。
   * opts: { delayNum=1, delayDen=60, numPlays=0(无限循环), onFrame(k) }
   * 结构：IHDR → acTL → [fcTL(seq0) IDAT] [fcTL(seq) fdAT(seq)]… → IEND，
   *       全画布帧 dispose=APNG_DISPOSE_OP_NONE、blend=APNG_BLEND_OP_SOURCE。
   * 返回 { data, frames }。 */
  async function encodeAPNG(w, h, total, getFrame, opts) {
    opts = opts || {};
    const delayNum = (opts.delayNum || 1) & 0xFFFF;
    const delayDen = (opts.delayDen || 60) & 0xFFFF;
    const parts = [PNG_SIG];
    /* IHDR（声明整块画布） */
    const ihdr = new Uint8Array(13);
    ihdr.set(u32(w), 0); ihdr.set(u32(h), 4);
    ihdr[8] = 8; ihdr[9] = 6; ihdr[10] = 0; ihdr[11] = 0; ihdr[12] = 0;
    parts.push(chunk('IHDR', ihdr));
    /* acTL：帧数 + 播放次数 */
    const actl = new Uint8Array(8);
    actl.set(u32(total), 0); actl.set(u32(opts.numPlays | 0), 4);
    parts.push(chunk('acTL', actl));
    let seq = 0;
    for (let k = 0; k < total; k++) {
      const rgba = await getFrame(k);
      if (!rgba) return { cancelled: true, frames: k };
      if (opts.onFrame) opts.onFrame(k);
      /* fcTL（26 字节数据）：全画布、偏移 0、dispose=0(NONE)、blend=0(SOURCE) */
      const fctl = new Uint8Array(26);
      fctl.set(u32(seq++), 0);
      fctl.set(u32(w), 4); fctl.set(u32(h), 8);
      fctl.set(u32(0), 12); fctl.set(u32(0), 16);
      fctl.set(u16(delayNum), 20); fctl.set(u16(delayDen), 22);
      fctl[24] = 0; fctl[25] = 0;
      parts.push(chunk('fcTL', fctl));
      const zbuf = await deflateRaw(toScanlines(rgba, w, h));
      if (k === 0) {
        parts.push(chunk('IDAT', zbuf));            /* 首帧走 IDAT（无 seq 前缀） */
      } else {
        const fdat = new Uint8Array(4 + zbuf.length);
        fdat.set(u32(seq++), 0);
        fdat.set(zbuf, 4);

    parts.push(chunk('IEND', new Uint8Array(0)));
    let totalLen = 0;
    for (const p of parts) totalLen += p.length;
    const out = new Uint8Array(totalLen);
    let off = 0;
    for (const p of parts) { out.set(p, off); off += p.length; }

<script>
/* PixelForge —— ZIP 写入器（store 方法，零依赖）
 * 逐条目追加压缩后数据，仅持有已压缩字节 → 内存可控。

  'use strict';

  const crc32 = (root.PF_PNG && root.PF_PNG.crc32) || (typeof module !== 'undefined' ? require('./png.js').crc32 : null);

  function u32(v) { return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }

    return {
      time: ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF,

    constructor() {

      this.central = [];
      this.offset = 0;
    }
    /* name: 字符串；data: Uint8Array */

      const nameBytes = new TextEncoder().encode(name);
      const now = dosTime(new Date());
      const crc = crc32(data, 0, data.length);
      const local = new Uint8Array(30 + nameBytes.length);
      local.set(u32(0x04034b50), 0);
      local.set(u16(20), 4);            // version
      local.set(u16(0x0800), 6);        // UTF-8 flag
      local.set(u16(0), 8);             // store
      local.set(u16(now.time), 10);
      local.set(u16(now.date), 12);
      local.set(u32(crc), 14);
      local.set(u32(data.length), 18);
      local.set(u32(data.length), 22);
      local.set(u16(nameBytes.length), 26);
      local.set(u16(0), 28);
      local.set(nameBytes, 30);
      this.entries.push({ name: nameBytes, crc, size: data.length, offset: this.offset, time: now.time, date: now.date });
      this.central.push(data);          // 数据稍后统一拼接（仅压缩后字节）
      this.offset += local.length + data.length;

      const n = this.entries.length;
      const centralSize = 46 * n + this.entries.reduce((a, e) => a + e.name.length, 0);
      const out = new Uint8Array(this.offset + centralSize + 22);
      let o = 0;
      for (const e of this.entries) {
        const local = new Uint8Array(30 + e.name.length);
        local.set(u32(0x04034b50), 0);
        local.set(u16(20), 4);
        local.set(u16(0x0800), 6);
        local.set(u16(0), 8);
        local.set(u16(e.time), 10);
        local.set(u16(e.date), 12);
        local.set(u32(e.crc), 14);
        local.set(u32(e.size), 18);
        local.set(u32(e.size), 22);
        local.set(u16(e.name.length), 26);
        local.set(u16(0), 28);
        local.set(e.name, 30);

        out.set(this.central.shift(), o); o += e.size;

        c.set(u16(20), 4); c.set(u16(20), 6);
        c.set(u16(0x0800), 8);
        c.set(u16(0), 10);
        c.set(u16(e.time), 12); c.set(u16(e.date), 14);
        c.set(u32(e.crc), 16);
        c.set(u32(e.size), 20); c.set(u32(e.size), 24);

<script>
/* PixelForge —— 导出任务（浏览器 Worker 与 Node 共用）
 *
 * 种类：
 *   frame    单帧 PNG（含透明通道）
 *   sequence PNG 序列 ZIP + timeline.json
 *   apng     APNG 动图（单文件，1/60s 每帧，无限循环）+ 配方 JSON
 *   batch    批量导出：多效果各取最佳时刻 PNG + 配方 JSON 合并为一个 ZIP
 *   sheet    多页 Sprite Sheet PNG ZIP + Aseprite 兼容 JSON
 *   recipe   效果配方 JSON
 *
 * 规则（务必与 docs/导出格式.md 一致）：
 *   - 采样时间 t = k / fps（fps=60），整数步 k —— 不做毫秒累加，不录屏
 *   - 循环导出：k ∈ [0, N-1]，帧 N ≡ 帧 0（周期逐位一致），不重复首帧
 *   - 非循环导出：k ∈ [0, N-1]，N = round(durationSec * fps)
 *   - sheet 逐页渲染编码：单页缓冲复用，页满即编码入 ZIP 并继续
 *     （全高分辨率帧从不同时驻留内存）
 *   - 取消：shouldCancel() 在每帧间检查 → 返回 {cancelled:true}，
 *     所有缓冲为局部变量，自然释放
 */
(function (root) {
  'use strict';
  const PF = root.PF || (root.parent && root.parent.PF);
  const PNG = root.PF_PNG || require('./png.js');
  const ZIP = root.PF_ZIP || require('./zip.js');

  const FPS = 60;

  function sanitizeName(s) {
    return String(s || 'effect').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 48) || 'effect';
  }

  /* 宏任务让步：确保 cancel 等消息事件有机会进入（纯 microtask 循环会饿死事件队列） */
  function yieldMacrotask() {
    return new Promise(res => {
      if (typeof MessageChannel !== 'undefined') {
        const ch = new MessageChannel();
        ch.port1.onmessage = () => { ch.port1.close(); res(); };
        ch.port2.postMessage(0);
      } else {
        setTimeout(res, 0);
      }
    });
  }

  /* 核心：渲染第 k 帧 → RGBA buffer（复用传入的 raster 与 compositeOut） */
  function renderFrameRGBA(eff, k, R, compOut) {
    eff.renderFrame(k, R);
    return R.composite(compOut, false);
  }

  async function runJob(job, cb) {
    cb = cb || {};
    const onProgress = cb.onProgress || (() => {});
    const shouldCancel = cb.shouldCancel || (() => false);
    const kind = job.kind;
    const name = sanitizeName(job.name);
    const entries = [];   // {name, data:Uint8Array}
    const CpuRaster = PF.Renderer;

    if (kind === 'recipe') {
      const eff = (job.config && job.config.items) ? PF.makeCombo(job.config) : PF.makeEffect(job.config);
      const json = JSON.stringify(PF.recipeToJSON(eff, job.note || ''), null, 2);
      entries.push({ name: name + '.pfx.json', data: new TextEncoder().encode(json) });
      onProgress(1, 1, 'recipe');
      return { kind, name, entries, json: JSON.parse(json) };
    }

    if (kind === 'batch') {
      /* 批量导出：多个效果配置各取「最佳时刻」单帧 PNG + 配方 JSON，打成一个 ZIP。
       * 逐个构建渲染（同一时刻只驻留一个效果实例与一帧），内存有界。
       * 注意：此分支不依赖单一 job.config，须在下方 eff 构建之前返回。 */
      const items = Array.isArray(job.items) ? job.items.slice(0, 64) : [];
      if (!items.length) throw new Error('批量导出需要 items 配置数组（1..64）');
      const zip = new ZIP.ZipWriter();
      const manifest = [];
      const used = new Set();
      for (let i = 0; i < items.length; i++) {
        if (shouldCancel()) return { kind, cancelled: true, done: i };
        await yieldMacrotask();
        const it = items[i] || {};
        const cfg = it.config || it;
        const canvasSize = it.canvasSize || job.canvasSize || cfg.canvasSize || PF.DEFAULT_CANVAS;
        const effB = cfg.items
          ? PF.makeCombo(Object.assign({}, cfg, { canvasSize }))
          : PF.makeEffect(Object.assign({}, cfg, { canvasSize }));
        const s = effB.canvasSize;
        const Rb = new CpuRaster(s);
        const k = Math.max(0, Math.min(effB.frameCount() - 1, Math.round((it.timeSec !== undefined ? it.timeSec : effB.thumbTime()) * FPS)));
        effB.renderFrame(k, Rb);
        const png = await PNG.encodePNG(Rb.composite(null, false), s, s);
        let base = sanitizeName(it.name || cfg.template || ('item' + i));
        if (used.has(base)) base += '_' + i;   // 去重：同名单独追加序号
        used.add(base);
        zip.add(base + '_peak.png', png);
        zip.add(base + '.pfx.json', new TextEncoder().encode(JSON.stringify(PF.recipeToJSON(effB, job.note || ''), null, 2)));
        manifest.push({ index: i, name: base, template: cfg.template || (cfg.items ? 'combo' : '?'), canvas: s, frame: k, timeSec: k / FPS });
        onProgress(i + 1, items.length, 'batch');
      }
      zip.add(name + '.batch.json', new TextEncoder().encode(JSON.stringify({
        format: 'pixelforge.batch',
        version: 1,
        app: PF.APP_NAME + ' ' + PF.VERSION,
        count: items.length,
        items: manifest,
      }, null, 2)));
      entries.push({ name: name + '_batch.zip', data: zip.finish() });
      onProgress(items.length, items.length, 'batch');
      return { kind, name, entries, count: items.length, manifest };
    }

    const eff = (job.config && job.config.items)
      ? PF.makeCombo(Object.assign({}, job.config, { canvasSize: job.canvasSize || job.config.canvasSize || PF.DEFAULT_CANVAS }))
      : PF.makeEffect(Object.assign({}, job.config, {
          canvasSize: job.canvasSize || (job.config && job.config.canvasSize) || PF.DEFAULT_CANVAS,
        }));
    const size = eff.canvasSize;
    const loop = eff.loop;
    const total = eff.frameCount();       // 循环: N 帧（不含重复尾帧）；非循环: N 帧
    const R = new CpuRaster(size);
    let compOut = null;

    if (kind === 'frame') {
      const k = Math.max(0, Math.min(total - 1, Math.round((job.timeSec !== undefined ? job.timeSec : eff.thumbTime()) * FPS)));
      if (shouldCancel()) return { kind, cancelled: true };
      compOut = renderFrameRGBA(eff, k, R, compOut);
      const png = await PNG.encodePNG(compOut, size, size);
      entries.push({ name: name + '_' + String(k).padStart(4, '0') + '.png', data: png });
      onProgress(1, 1, 'frame');
      return { kind, name, entries, frameIndex: k, total };
    }

    if (kind === 'sequence') {
      const zip = new ZIP.ZipWriter();
      const framesInfo = [];
      for (let k = 0; k < total; k++) {
        if (shouldCancel()) return { kind, cancelled: true, done: k };
        await yieldMacrotask();
        compOut = renderFrameRGBA(eff, k, R, compOut);
        const png = await PNG.encodePNG(compOut, size, size);
        const fn = name + '_' + String(k).padStart(4, '0') + '.png';
        zip.add(fn, png);
        framesInfo.push({ index: k, file: fn, timeSec: k / FPS });
        if (k % 4 === 0 || k === total - 1) onProgress(k + 1, total, 'sequence');
      }
      const timeline = {
        format: 'pixelforge.timeline',
        version: 1,
        app: PF.APP_NAME + ' ' + PF.VERSION,
        name,
        fps: FPS,
        timebase: '1/' + FPS,
        frameCount: total,
        durationSec: total / FPS,
        loop,
        frameDurationMsExact: 1000 / FPS,
        frameTimeRule: 'frameTimeSec(k) = k / fps。请勿以累加舍入毫秒的方式重建时间轴。',
        canvas: { width: size, height: size },
        recipe: PF.recipeToJSON(eff),
        frames: framesInfo,
      };
      zip.add(name + '.timeline.json', new TextEncoder().encode(JSON.stringify(timeline, null, 2)));
      entries.push({ name: name + '_sequence.zip', data: zip.finish() });

       * 与 sequence 相同的内存纪律：逐帧渲染→压缩→只保留压缩字节。 */
      let compOut = null;
      const anim = await PNG.encodeAPNG(size, size, total, k => {
        if (shouldCancel()) return null;
        compOut = renderFrameRGBA(eff, k, R, compOut);
        return compOut;
      }, { delayNum: 1, delayDen: FPS, numPlays: 0, onFrame: k => { if (k % 4 === 0 || k === total - 1) onProgress(k + 1, total, 'apng'); } });

    }

    if (kind === 'sheet') {
      const padding = Math.max(0, Math.min(32, job.padding === undefined ? 2 : job.padding | 0));
      const maxPage = Math.max(256, Math.min(8192, job.maxPage === undefined ? 4096 : job.maxPage | 0));

      const step = cell + padding;

      const rows = cols;
      const perPage = cols * rows;
      const pages = Math.ceil(total / perPage);
      const zip = new ZIP.ZipWriter();
      const frameRects = [];   // {index,page,x,y,w,h,timeSec,anchor}
      const pageMeta = [];
      /* 实际页宽 = cols*step ≤ maxPage：页缓冲按真实尺寸预分配（旧实现按 maxPage²
       * 多留出最大 10~15% 死空间），blit 以 pageW 为行距，编码字节不变 */
      const pageW = Math.min(maxPage, cols * step);
      const compOutPage = new Uint8ClampedArray(pageW * pageW * 4); // 单页缓冲复用
      const clearPage = compOutPage.fill.bind(compOutPage, 0);
      let page = 0, idxInPage = 0;
      for (let k = 0; k < total; k++) {
        if (shouldCancel()) return { kind, cancelled: true, done: k, pages };
        await yieldMacrotask();
        if (idxInPage === 0) clearPage();
        compOut = renderFrameRGBA(eff, k, R, compOut);
        const col = idxInPage % cols, row = (idxInPage / cols) | 0;
        const px = col * step, py = row * step;
        /* blit 单元格（含 padding 间隙留白） */
        for (let y = 0; y < cell; y++) {
          const src = y * size * 4;
          const dst = ((py + y) * pageW + px) * 4;
          compOutPage.set(compOut.subarray(src, src + size * 4), dst);
        }
        frameRects.push({ index: k, page, x: px, y: py, w: cell, h: cell, timeSec: k / FPS, anchor: { x: cell >> 1, y: cell >> 1 } });
        idxInPage++;
        if (idxInPage === perPage || k === total - 1) {
          const usedRows = row + 1;
          /* 页宽 = cols*step，页高 = usedRows*step（单元格内含 padding 间隙） */
          const pw = Math.min(maxPage, cols * step);
          const ph = Math.min(maxPage, usedRows * step);
          const png = await PNG.encodePNG(compOutPage, pw, ph);
          const fn = name + '_sheet_' + String(page).padStart(2, '0') + '.png';
          zip.add(fn, png);
          pageMeta.push({ image: fn, page, size: { w: pw, h: ph }, frames: frameRects.filter(f => f.page === page).map(f => f.index) });
          page++; idxInPage = 0;
          onProgress(k + 1, total, 'sheet');
        } else if (k % 4 === 0) onProgress(k + 1, total, 'sheet');
      }
      const sheetJson = {
        frames: {},
        meta: {
          app: PF.APP_NAME + ' ' + PF.VERSION,
          format: 'RGBA8888',
          scale: '1',
          pixelfx: {
            fps: FPS,
            timebase: '1/' + FPS,
            frameDurationMsExact: 1000 / FPS,
            frameTimeRule: 'frameTimeSec(k) = k / fps',
            loop,
            frameCount: total,
            padding,
            cell: { w: cell, h: cell },
            anchorSpec: '每帧锚点为所在单元格中心，单位为页内像素',
            pages: pageMeta,
            recipe: PF.recipeToJSON(eff),
          },
        },
      };
      for (const f of frameRects) {
        const key = name + '_' + String(f.index).padStart(4, '0');
        sheetJson.frames[key] = {
          index: f.index,
          frame: { x: f.x, y: f.y, w: f.w, h: f.h },
          rotated: false,
          trimmed: false,
          spriteSourceSize: { x: 0, y: 0, w: f.w, h: f.h },
          sourceSize: { w: f.w, h: f.h },
          duration: 1000 / FPS,
          page: f.page,
          timeSec: f.timeSec,
          anchor: f.anchor,
        };
      }
      zip.add(name + '.sheet.json', new TextEncoder().encode(JSON.stringify(sheetJson, null, 2)));
      entries.push({ name: name + '_sheet.zip', data: zip.finish() });
      onProgress(total, total, 'sheet');
      return { kind, name, entries, frameCount: total, pages, sheet: sheetJson };
    }

    throw new Error('未知导出种类: ' + kind);
  }

  }
