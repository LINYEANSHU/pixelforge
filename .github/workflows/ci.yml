name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Syntax check (node --check all .js)
        run: |
          git ls-files -z '*.js' '*.cjs' | xargs -0 -n 1 node --check

      - name: Run renderer and export tests
        run: node tests/run-tests.cjs

      - name: Test project checkpoints and double strikes
        run: node --test tests/project.test.cjs
